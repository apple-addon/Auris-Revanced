name: Optimised APK

# One artifact only: the smaller R8-optimized arm64 APK. The fast/unminified
# lane is intentionally absent from this workflow.
on:
  workflow_dispatch:
  push:
    branches: ["optimised", "Exclusive-V1"]

permissions:
  contents: write

concurrency:
  group: optimised-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-branches:
    name: Fast-forward shared branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Move ancestor branches to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          target="$GITHUB_SHA"
          for branch in feature/automix-core-v2 feat/apple-core; do
            current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq .object.sha)
            status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$current...$target" --jq .status)
            case "$status" in
              ahead|identical) ;;
              *)
                echo "::error::$branch is not an ancestor of $target ($status); refusing to move it."
                exit 1
                ;;
            esac
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" \
              -f sha="$target" -F force=false
          done

  build:
    name: Build R8 APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'

      - run: chmod +x gradlew

      - name: Write local.properties
        run: |
          {
            echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}"
            echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}"
          } > local.properties

      - name: Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > bitchord-fork.jks
          {
            echo "storeFile=bitchord-fork.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=forkdebug"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      # No -Pauris.fastApk=true: R8 and resource shrinking stay enabled.
      - name: Build optimized APK
        run: |
          ./gradlew \
            --build-cache --parallel --console=plain \
            -Pauris.skipLintVital=true \
            :app:assembleDevRelease

      - name: Collect arm64 APK
        run: |
          set -euo pipefail
          mkdir -p dist
          apk=$(find app/build/outputs/apk/dev/release -type f -name '*arm64-v8a*.apk' | head -1)
          test -n "$apk"
          cp "$apk" dist/Auris-Revanced-optimised-arm64-v8a.apk
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: Auris-Revanced-optimised-arm64-v8a
          path: dist/Auris-Revanced-optimised-arm64-v8a.apk
          compression-level: 0
          if-no-files-found: error

  release:
    name: Draft optimized release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Auris-Revanced-optimised-arm64-v8a
          path: dist

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v3.1.7-optimised
          TITLE: Auris Revanced 3.1.7 — optimized
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TITLE"
          else
            gh release create "$TAG" dist/*.apk \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "$TITLE" \
              --notes "R8-optimized arm64 build. UI performance fixes; all animations and features preserved."
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,assets \
            --jq '{tag: .tagName, draft: .isDraft, assets: [.assets[].name]}'
