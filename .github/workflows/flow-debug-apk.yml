name: Flow Debug APK

on:
  workflow_dispatch:
  push:
    # draft-*, not v*.*.*: the desktop release workflow listens on v*.*.*, and
    # a tag that matches both patterns builds the desktop app as well. The
    # two are disjoint by name now, so a draft tag can never start a desktop
    # build.
    tags: ["draft-*"]

# A second dispatch replaces the first instead of queueing behind it: two
# APKs from the same ref are never both wanted.
concurrency:
  group: flow-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # Gradle's own cache, restored and saved with a dependency-aware key and
      # with the local build cache inside it. setup-java's `cache: gradle` only
      # restores on an exact hit of the *.gradle* hash and carries no build
      # cache, so a single dependency bump used to throw the whole download set
      # away; this restores the closest entry instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'

      - run: chmod +x gradlew

      # Minified release runtime (R8 per app/build.gradle.kts: unoptimized
      # debug Compose runs measurably slower) signed with this repository's own
      # key — the upstream fork key was not available, so a draft signed by it
      # needs one uninstall before this one installs over it.
      - name: Signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD are not set for this repository; the APK cannot be signed."
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > bitchord-fork.jks
          {
            echo "storeFile=bitchord-fork.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=forkdebug"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > keystore.properties

      # No test step in front of this. The unit-test task compiles the app's
      # test sources and its native variant first, and those six minutes were
      # most of a draft's wall clock — for a gate that only says whether the
      # Flow scoring and the queue builder still agree with themselves.
      #
      # What is still guaranteed: the APK step compiles every module the app
      # is made of, so a build that does not compile never produces an APK.
      # What is no longer guaranteed: a draft can carry a behaviour change
      # that compiles and is wrong. Run :app:testDevDebugUnitTest locally
      # before pushing a change worth testing on a phone.
      #
      # lintVital is not skipped — -Pauris.fastApk=true drops it from *this*
      # invocation only, because the `lint` job below runs the same task in
      # parallel. The `deliver` job needs both, so no artifact exists unless
      # lint passes. Measured: the pass costs ~200s on top of the compile, so
      # serialising it in front of the APK was the single biggest cost here.
      - name: Build minified APK
        run: |
          ./gradlew \
            --build-cache --parallel --console=plain \
            -Pauris.fastApk=true \
            :app:assembleDevRelease

      # Staging only: the deliverable copy is uploaded by `deliver`, after the
      # lint job has passed.
      - name: Upload the built APKs
        uses: actions/upload-artifact@v4
        with:
          name: apk-staging
          path: app/build/outputs/apk/dev/release/*.apk
          # The APKs are already deflated; re-compressing them for the artifact
          # zip only spends runner time.
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  lint:
    name: lintVital
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          add-job-summary: 'on-failure'

      - run: chmod +x gradlew

      # The release gate exactly as AGP wires it: fatal-severity lint, build
      # aborted on a hit. Same task the assemble would have run, on its own
      # runner, while the APK builds.
      - name: Fatal-severity lint
        run: ./gradlew --build-cache --parallel --console=plain :app:lintVitalDevRelease

      - name: Upload the lint report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: |
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: ignore
          retention-days: 7

  deliver:
    name: Deliver
    needs: [build-debug, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: apk-staging
          path: dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bitchord-next-release
          path: dist/*.apk
          compression-level: 0
          if-no-files-found: error
